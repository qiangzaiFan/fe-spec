# GitHub Actions 工作流名称，会展示在仓库的 Actions 页面。
name: Build and Deploy

# 这里只在推送到 master 分支时触发文档构建与部署。
on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    # 使用 GitHub 托管的 Ubuntu 环境执行构建。
    runs-on: ubuntu-latest
    permissions:
      # 允许工作流把构建产物推送到 gh-pages 分支。
      contents: write
    steps:
      # 拉取当前仓库代码，供后续安装依赖和构建使用。
      - name: Checkout
        uses: actions/checkout@v2.3.1

      # 固定 Node.js 版本，避免不同运行时导致构建结果不一致。
      - name: lock npm version
        uses: actions/setup-node@v3
        with:
          node-version: 18.14.0

      # 安装 pnpm，并执行项目约定的初始化与文档构建脚本。
      - name: Install and Build
        run: |
          npm i -g pnpm
          pnpm run init
          pnpm run docs:build
        env:
          # 提高 Node 可用内存，并兼容某些旧版 OpenSSL 依赖。
          NODE_OPTIONS: '--max_old_space_size=4096 --openssl-legacy-provider'

      # 将构建好的静态站点发布到 gh-pages 分支。
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@4.1.3
        with:
          BRANCH: gh-pages
          FOLDER: docs/.vuepress/dist
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
